  public float speed = 5f, dashForce = 12f, dashCd = 0.8f;
  Vector2 input; bool canDash = true;
  void Update(){
    input = new Vector2(Input.GetAxisRaw("Horizontal"), Input.GetAxisRaw("Vertical")).normalized;
    if(Input.GetKeyDown(KeyCode.Space) && canDash) StartCoroutine(Dash());
  }
  void FixedUpdate(){
    if(isDashing) return;
    rb.MovePosition(rb.position + input * speed * Time.fixedDeltaTime);
  }
  IEnumerator Dash(){
    isDashing = true; canDash = false;
    rb.AddForce(input * dashForce, ForceMode2D.Impulse);
    yield return new WaitForSeconds(0.15f);
    isDashing = false;
    yield return new WaitForSeconds(dashCd);
    canDash = true;
  }
}`},point:"Selalu .normalized() input. Dash pakai AddForce + cooldown flag, bukan teleport."},{h:"2. Combat System (Hitbox, Damage Formula, Crit)",p:"Pisahkan Hitbox (area serang) dan Hurtbox (area kena). Damage = (ATK * skillMod - DEF) * crit.",icon:"Sword",code:{lang:"GDScript",content:`func calculate_damage(atk:int, def:int, crit_chance:float):
  var base = max(1, atk - def)
  var is_crit = randf() < crit_chance
  var dmg = base * (2.0 if is_crit else 1.0)
  return {"dmg": dmg, "crit": is_crit}

func _on_hitbox_entered(hurtbox):
  if hurtbox.has_method("take_damage"):
    var res = calculate_damage(atk, hurtbox.def, 0.15)
    hurtbox.take_damage(res.dmg, res.crit)
    hitstop(0.05) # freeze frame`},diagram:`HITBOX (Sword) ──►  overlaps  ──► HURTBOX (Enemy)
